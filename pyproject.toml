[tool.uv]
# Prevents 'uv sync' or 'uv run' from treating the root as an installable package
package = false

# ------------------------------------------------------------------------------
# Centralized Ruff Configuration
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

# ------------------------------------------------------------------------------
# Centralized Basedpyright Configuration
# ------------------------------------------------------------------------------
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

include = [
    "client/*/*/src", "client/*/*/test",
    "server/*/*/src", "server/*/*/test",
    "data_management/*/*/src", "data_management/*/*/test",
    "monitoring/*/*/src", "monitoring/*/*/test"
]
exclude = ["**/__pycache__", "**/.venv", "**/.uv"]

# ------------------------------------------------------------------------------
# Centralized Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.uv.workspace]
members = [
    "client/*",
    "server/*",
    "data_management/*",
    "monitoring/*",
    "client/client_example",
]
