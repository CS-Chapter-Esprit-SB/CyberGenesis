[project]
name = "logger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed-jpeg", email = "Mouhamed.Cherif@esprit.tn" }
]
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
]

[project.scripts]
client-example = "client_example:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]


[tool.pyright]
venvPath = "server/logger"
venv = ".venv"
extraPaths = ["server/logger/src"]


[tool.coverage.run]
source = ["src/logger"]

[tool.coverage.report]
fail_under = 100
show_missing = true
