services:
  postgres:
    image: postgres:16
    container_name: cybergen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybergen}
      POSTGRES_USER: ${POSTGRES_USER:-cybergen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybergen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybergen} -d ${POSTGRES_DB:-cybergen}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cybergen-net

  redis:
    image: redis:7
    container_name: cybergen-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cybergen-net

networks:
  cybergen-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
