[project]
name = "server-by-api-gateway"
version = "0.1.0"
description = "API Gateway Service: FastAPI entrypoint routing client requests to downstream microservices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
server-by-api-gateway = "server_by_api_gateway.main:run"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
