[project]
name = "server-example"
version = "0.1.0"
description = "Example server package for validating the CyberGenesis monorepo setup."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
]

[project.scripts]
server-example = "server_example:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"