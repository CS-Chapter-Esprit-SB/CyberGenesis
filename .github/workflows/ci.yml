name: Microservices CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Stage 1: Dynamically locate all project directories matching the structure
  discover-projects:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find all microservice project paths
        id: set-matrix
        run: |
          # Finds all subdirectories containing a pyproject.toml file
          DIRS=$(find . -mindepth 3 -maxdepth 4 -type f -name "pyproject.toml" ! -path "./pyproject.toml" -exec dirname {} \; | jq -R . | jq -s -c .)

          # Edge case: Handle empty matrix safely
          if [ "$DIRS" == "[]" ] || [ -z "$DIRS" ]; then
            echo "No microservices found!"
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            echo "matrix=$DIRS" >> $GITHUB_OUTPUT
          fi

  # Stage 2: Lint and Test every discovered service concurrently
  lint-and-test:
    needs: discover-projects
    runs-on: ubuntu-latest
    if: ${{ needs.discover-projects.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        project-path: ${{ fromJson(needs.discover-projects.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.project-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # <-- REQUIRED: Downloads your code into the job runner

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff (Linter & Formatter Check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest
        run: uv run pytest test/

  # Stage 3: Docker Build Check
  docker-build:
    needs: discover-projects
    runs-on: ubuntu-latest
    if: ${{ needs.discover-projects.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        project-path: ${{ fromJson(needs.discover-projects.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Validation Only)
        run: |
          if [ -f "${{ matrix.project-path }}/Dockerfile" ]; then
            docker build ${{ matrix.project-path }} --file ${{ matrix.project-path }}/Dockerfile
          else
            echo "No Dockerfile found in ${{ matrix.project-path }}, skipping..."
          fi

  # Stage 4: Single status check for GitHub Branch Protection
  ci-success:
    name: "CI Status Check (All Passed)"
    needs: [discover-projects, lint-and-test, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check overall pipeline result
        run: |
          LINT_RESULT="${{ needs.lint-and-test.result }}"
          DOCKER_RESULT="${{ needs.docker-build.result }}"

          # If no matrix jobs ran because no microservices exist, mark as success
          if [[ "$LINT_RESULT" == "skipped" && "$DOCKER_RESULT" == "skipped" ]]; then
            echo "No microservices detected. Skipping checks."
            exit 0
          fi

          if [[ ("$LINT_RESULT" == "success" || "$LINT_RESULT" == "skipped") && ("$DOCKER_RESULT" == "success" || "$DOCKER_RESULT" == "skipped") ]]; then
            echo "All microservice checks passed successfully!"
            exit 0
          else
            echo "One or more microservice checks failed."
            exit 1
          fi
